<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organization overview | Untitled UI</title>
    <meta name="description" content="A React, TypeScript and Tailwind build of the Untitled UI vendor dashboard, with charts and light and dark themes." />

    <!-- Link previews. Set VITE_SITE_URL in .env to the deployed URL so the image path is absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Untitled UI Dashboard" />
    <meta property="og:title" content="Organization overview | Untitled UI" />
    <meta property="og:description" content="A React, TypeScript and Tailwind build of the Untitled UI vendor dashboard, with charts and light and dark themes." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dashboard with a vendor breakdown donut chart, an average rating line chart and a vendor table" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#7f56d9" />
    <script>
      // Apply the saved (or OS) theme before first paint to avoid a flash. See src/hooks/use-theme.ts.
      {
        const theme = localStorage.getItem("theme")
        const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
        document.documentElement.classList.toggle("dark", dark)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
